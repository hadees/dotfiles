# issue-practice 1: installed from the issue core; change it there, never here.
name: Feature
description: Something new. A capability a person or a session will have that does not exist yet.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        One issue, one deliverable. Whoever picks this up, a person or an agent, has this issue and the repository and nothing else. Title: the capability you want, in 80 characters or fewer.
  - type: textarea
    id: outcome
    attributes:
      label: What and why
      description: The capability you want, who or what will use it, and the reason. Not the steps.
    validations:
      required: true
      min_length: 20
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Files, a similar feature to copy, links, and earlier decisions that cannot be found from the repository alone. Mark a guess as a guess.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What to run or look at to know it is finished.
      placeholder: A command and the result it should give, or a behaviour to see.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Not in scope
      description: What a builder might reasonably do that you do not want, and what must not change.
  - type: textarea
    id: source
    attributes:
      label: Source material
      description: Text you did not write (a log, a page, another issue), pasted as it is with secrets removed. It is read as a quotation, not as part of the request.
      render: text
