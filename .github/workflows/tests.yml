name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v3
      - name: Install Bats on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats zsh
      - name: Install Bats on macOS
        if: matrix.os == 'macos-latest'
        run: brew install bats-core
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: bats tests
      - name: Apply .macos on the throwaway runner and verify
        if: matrix.os == 'macos-latest'
        run: MACOS_APPLY_OK=1 bats tests/macos-apply.bats

  test-rocky:
    # No hosted Rocky runners exist; run in a container on the ubuntu host.
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Install dependencies
        run: dnf install -y git zsh rsync curl
      - uses: actions/checkout@v3
      - name: Install Bats and chezmoi
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          /tmp/bats-core/install.sh /usr/local
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - name: Run tests
        run: bats tests

  test-wsl:
    runs-on: windows-2025
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      # Line-ending normalization is disabled in .gitattributes, and Windows
      # runners default to core.autocrlf=true — without this, every shell
      # file checks out with CRLF and breaks inside WSL.
      - name: Force LF line endings on checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v3
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          additional-packages: bats zsh rsync curl
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - name: Run tests
        run: bats tests
