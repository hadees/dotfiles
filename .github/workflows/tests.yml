name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # tests/claude-peer-screen.bats draws the waiting pane in tmux and reads the
    # screen. SCREEN_TESTS_REQUIRE names what a job has installed for it; a named
    # tool that is missing fails those tests instead of skipping them. fzf is an
    # fzf of 0.75 or newer (the picker). No job takes it from its image's
    # packages, whose index is as old as the image: each installs the release
    # named in .github/fzf-version (see .github/install-fzf.sh) and then checks
    # that it is the first one on PATH.
    strategy:
      # One platform failing must not cancel the other: each meets what the other
      # does not (macOS the BSD tools and .macos, ubuntu the runner's own
      # XDG_CONFIG_HOME), and a cancelled job reads as a hang.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Bats on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh tmux parallel
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version
      # macOS's /bin/bash is 3.2, under which bats silently ignores a failing
      # `[[ ]]` that is not a test's last command; a modern bash must be
      # first on PATH (tests/shell.bats enforces it).
      - name: Install Bats on macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install bats-core bash tmux parallel
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # After the brew step on purpose: the directory written to GITHUB_PATH last
      # comes first on PATH, so this fzf is ahead of any a package manager brings.
      - name: Install the pinned fzf
        run: |
          sh .github/install-fzf.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # tests/finicky.bats and tests/chrome-pairing.bats run the .ts routing
      # config under Node (>= 22.6 strips types natively); NODE_TESTS_REQUIRED
      # (below) makes a missing or old Node fail them instead of skipping.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check that the fzf on PATH is the pinned one
        run: sh .github/install-fzf.sh --check
      - name: Run tests
        # Files run N at a time (N = cores) through GNU parallel, tests within a
        # file stay in order: across files, the step took 144 s on ubuntu
        # (serial: 398 s), whereas within-file parallelism was twice as slow
        # again (bats polls its semaphore once a second). Results print per finished
        # file, --timing keeps the per-test times. The Linux jobs build bats from
        # a tag: a distribution's bats is as old as the distribution, and --jobs
        # hung on WSL with the packaged one. TESTS_WAIT_SCALE=3 triples the
        # polling waits in tests/claude-peer.bats, which a loaded runner outran.
        # The timeout is what turns a hang into a red job. macOS stays serial
        # for now: across files it failed every run since TESTS_WAIT_SCALE went
        # in (3 of 3, 5 of 5 overall), on differing timing waits (claude-peer
        # wake, remote-mcp's forwarder start), so the scale does not rescue it.
        timeout-minutes: 30
        run: |
          # bats refuses --no-parallelize-within-files below --jobs 2
          par="--jobs $(getconf _NPROCESSORS_ONLN) --no-parallelize-within-files"
          [ "$RUNNER_OS" = macOS ] && par=
          TESTS_WAIT_SCALE=3 NODE_TESTS_REQUIRED=1 SCREEN_TESTS_REQUIRE='tmux fzf' bats --timing $par tests

  # .macos applied for real and read back (tests/macos-apply.bats). Its own job
  # so its ~5 minutes run beside the suite instead of after it on the macOS job.
  test-macos-apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Bats
        run: |
          brew install bats-core bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Apply .macos on the throwaway runner and verify
        run: MACOS_APPLY_OK=1 bats tests/macos-apply.bats

  # The README's fresh-machine command, run for real end to end: the get.chezmoi.io
  # installer, --one-shot against this checkout, ephemeral class. Proves a
  # disposable box gets a working shell config, no identity, and no chezmoi
  # left behind — the one path the sandboxed bats suites cannot cover.
  test-bootstrap:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y curl git zsh rsync ca-certificates
      - uses: actions/checkout@v7
      - name: One-shot bootstrap from a copy of this checkout
        # --one-shot purges the SOURCE directory after applying, so it must
        # run against a copy — pointing it at $GITHUB_WORKSPACE deletes the
        # runner's working directory out from under the job.
        run: |
          cp -a "$GITHUB_WORKSPACE" /tmp/dotfiles-src
          cd /tmp
          sh -c "$(curl -fsLS get.chezmoi.io)" -- init --one-shot \
            --source /tmp/dotfiles-src --promptString machineClass=ephemeral
      - name: Verify the ephemeral contract
        run: |
          test -f "$HOME/.zshrc"
          test -f "$HOME/.functions"
          zsh -c 'source "$HOME/.zshrc"' </dev/null
          # ephemeral means no identity, no secrets, no Claude profiles
          test ! -e "$HOME/.gitconfig.local"
          test ! -e "$HOME/.gitconfig.work"
          test ! -e "$HOME/.extra"
          test ! -d "$HOME/.claude"
          test ! -d "$HOME/.claude-hadees"
          # --one-shot removes chezmoi, its state, and the source copy. This step
          # runs under `sh -e`, which ignores a failing `!`, hence the explicit if;
          # the installer's default directory is bin under the cwd it ran from (/tmp).
          if command -v chezmoi; then echo "chezmoi is still on PATH"; exit 1; fi
          test ! -e /tmp/bin/chezmoi
          test ! -d "$HOME/.config/chezmoi"
          test ! -d "$HOME/.local/share/chezmoi"
          test ! -d /tmp/dotfiles-src

  test-rocky:
    # No hosted Rocky runners exist; run in a container on the ubuntu host.
    runs-on: ubuntu-latest
    # --init: Actions starts a job container with `tail -f /dev/null` as process 1,
    # which never reaps. A pane orphaned by `tmux kill-server` then stays a zombie
    # that still answers `kill -0`, and the screen tests wait for it until they fail.
    container:
      image: rockylinux:9
      options: --init
    steps:
      - name: Install dependencies
        # No explicit curl: the image ships curl-minimal, which conflicts
        # with the full package but already provides the curl binary.
        # diffutils is NOT in this image (neither diff nor cmp), unlike the
        # ubuntu and WSL runners — tests that compare two files died with
        # status 127 rather than a failed comparison, which reads as a broken
        # assertion instead of a missing package. procps-ng is missing too
        # (no ps), which claude-peer needs to find the sessions it stops.
        run: dnf install -y git zsh rsync diffutils procps-ng
      - uses: actions/checkout@v7
      - name: Install tmux for the screen tests
        run: dnf install -y tmux
      - name: Install GNU parallel (bats --jobs)
        run: dnf install -y epel-release && dnf install -y parallel util-linux
      - name: Install Bats and chezmoi
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          /tmp/bats-core/install.sh /usr/local
          bats --version
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - name: Install the pinned fzf
        run: sh .github/install-fzf.sh /usr/local/bin
      - name: Check that the fzf on PATH is the pinned one
        run: sh .github/install-fzf.sh --check
      - name: Run tests
        # No Node here on purpose: tests/finicky.bats and tests/chrome-pairing.bats
        # are OS-independent logic, run on ubuntu and macOS, so skipping them on
        # Rocky is intended (NODE_TESTS_REQUIRED stays unset).
        # The image sets no locale, and the screen tests match glyphs as characters
        # (their harness test says so by name when the charmap is not UTF-8).
        # Parallel across files as on the test job (see the comment there).
        env:
          LANG: C.UTF-8
        timeout-minutes: 30
        run: TESTS_WAIT_SCALE=3 SCREEN_TESTS_REQUIRE='tmux fzf' bats --timing --jobs "$(getconf _NPROCESSORS_ONLN)" --no-parallelize-within-files tests

  test-wsl:
    runs-on: windows-2025
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      # Line-ending normalization is disabled in .gitattributes, and Windows
      # runners default to core.autocrlf=true — without this, every shell
      # file checks out with CRLF and breaks inside WSL.
      - name: Force LF line endings on checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          additional-packages: zsh rsync curl tmux parallel
      - name: Install Bats from source
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          /tmp/bats-core/install.sh /usr/local
          bats --version
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - name: Install the pinned fzf
        run: sh .github/install-fzf.sh /usr/local/bin
      - name: Check that the fzf on PATH is the pinned one
        run: sh .github/install-fzf.sh --check
      - name: Run tests
        # No Node here on purpose: tests/finicky.bats and tests/chrome-pairing.bats
        # are OS-independent logic, run on ubuntu and macOS, so skipping them on
        # WSL is intended (NODE_TESTS_REQUIRED stays unset).
        # Parallel across files as on the test job, but in a session of its own
        # with no terminal: with the step's terminal, --jobs hung; without one it
        # passed three runs of three at 530 s (serial: 1066 s).
        timeout-minutes: 30
        run: |
          exec </dev/null
          TESTS_WAIT_SCALE=3 SCREEN_TESTS_REQUIRE='tmux fzf' setsid -w bats --timing --jobs "$(getconf _NPROCESSORS_ONLN)" --no-parallelize-within-files tests
